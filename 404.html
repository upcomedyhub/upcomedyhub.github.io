<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>404 — UPComedyHub</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111111;
      text-align: center;
    }

    .error-box {
      max-width: 600px;
    }

    .error-code {
      font-size: 100px;
      font-weight: 900;
      color: #e63946;
      line-height: 1;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 12px;
    }

    p {
      font-size: 17px;
      margin-bottom: 25px;
      color: #555555;
    }

    .home-btn {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 25px;
      background: #e63946;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      transition: 0.3s ease;
    }

    .home-btn:hover {
      transform: scale(1.05);
    }

    @media (max-width: 700px) {
      .error-code {
        font-size: 75px;
      }

      h1 {
        font-size: 26px;
      }

      p {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="error-box">

    <div class="error-code">404</div>

    <h1>😂 Oops! Page Nahi Mili</h1>

    <p>
      Lagta hai ye page comedy karte-karte kahin gayab ho gaya! 😅
    </p>

    <a class="home-btn" href="/">
      🏠 Back To Home
    </a>

  </div>

</body>

</html>
