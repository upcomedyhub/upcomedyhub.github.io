<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background / Squircle Gradient -->
    <linearGradient id="squircleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#25252d"/>
      <stop offset="30%" stop-color="#18181f"/>
      <stop offset="70%" stop-color="#0e0e13"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>

    <!-- Top Rim Specular Highlight -->
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.28)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>

    <!-- Soft White Glyph Gradient -->
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f3f7"/>
    </linearGradient>

    <!-- Drop Shadow Filter for Squircle -->
    <filter id="squircleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="35" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Full Black Canvas -->
  <rect width="1024" height="1024" fill="#000000"/>

  <!-- Main Squircle Icon (Centered, 750x750) -->
  <g filter="url(#squircleShadow)">
    <rect x="137" y="137" width="750" height="750" rx="220" ry="220" fill="url(#squircleGrad)"/>
    <!-- Subtle Inner Rim Border -->
    <rect x="138.5" y="138.5" width="747" height="747" rx="218.5" ry="218.5" fill="none" stroke="url(#rimLight)" stroke-width="3"/>
  </g>

  <!-- Play Button Triangle (Upper Center) -->
  <!-- Centered horizontally around x=512, pointing east -->
  <!-- Vertices: Top-left (415, 290), Bottom-left (415, 600), Right-point (675, 445) with rounded corners -->
  <path d="M 425 292 C 405 280 380 295 380 318 L 380 572 C 380 595 405 610 425 598 L 646 471 C 665 460 665 430 646 419 Z"
        fill="url(#glyphGrad)"/>

  <!-- Smiling Arc (Below Play Button) -->
  <!-- Curves from (250, 480) down through (512, 730) up to (774, 480) -->
  <path d="M 252 485 C 252 745, 772 745, 772 485"
        fill="none"
        stroke="url(#glyphGrad)"
        stroke-width="70"
        stroke-linecap="round"/>
</svg>